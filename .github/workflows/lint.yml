name: Lint & Test

on:
  push:
    branches-ignore:
      - main
      - dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-job:
    name: Lintting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mdvault
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome CI check
        run: |
          set -o pipefail
          bun run check --reporter=github 2>&1 | tee lint-report.txt

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test --reporter=default --reporter=junit --outputFile=test-report.xml

      - name: Publish test report
        if: ${{ always() && hashFiles('mdvault/test-report.xml') != '' }}
        uses: dorny/test-reporter@v3
        with:
          name: Unit Tests
          path: mdvault/test-report.xml
          reporter: java-junit
          use-actions-summary: true
