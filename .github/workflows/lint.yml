name: Lint, Test & Security

on:
  push:
    branches-ignore:
      - main
      - dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.ref || github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Trivy — filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-report.sarif
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload Trivy FS SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-report.sarif
          category: trivy-fs

      - name: Trivy — Dockerfile scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ./mdvault/Dockerfile
          format: sarif
          output: trivy-dockerfile-report.sarif
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload Trivy Dockerfile SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-dockerfile-report.sarif
          category: trivy-dockerfile

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: mdvault/package.json

      - name: Bun audit
        working-directory: ./mdvault
        run: bun install --frozen-lockfile && bun audit --json > bun-audit-report.json

      - name: Upload bun audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bun-audit-report-${{ github.run_id }}
          path: ./mdvault/bun-audit-report.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Auto build
        uses: github/codeql-action/autobuild@v3

      - name: Analyze code with CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql-js

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --sarif --results=verified,unknown

  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mdvault
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome CI check
        run: |
          set -o pipefail
          bun run check --reporter=github 2>&1 | tee lint-report.txt

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.run_id }}
          path: ./mdvault/lint-report.txt
