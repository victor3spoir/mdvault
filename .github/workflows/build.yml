name: Release (Docker)

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          bake-target: mdvault
          flavor: latest=false
          tags: |
            # dev branch → :dev
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}

            # main branch → :main + :latest
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

            # v1.2.3 → :1.2.3
            type=match,pattern=^v(.*)$,group=1

      - uses: docker/bake-action@v5
        with:
          files: |
            docker-bake.hcl
            ${{ steps.meta.outputs.bake-file }}
          push: true
          pull: true
          targets: mdvault
          set: mdvault.no-cache-filter=runtime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}

  docker-image-scan:
    name: Docker Image Scan (Trivy)
    runs-on: ubuntu-latest
    needs: docker-build
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy — image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.docker-build.outputs.image-ref }}
          format: sarif
          output: trivy-image-report.sarif
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true

      - name: Upload Trivy image SARIF to GitHub Security tab
        if: ${{ always() && hashFiles('trivy-image-report.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-report.sarif
          category: trivy-image
